<text x="51" y="842" fill="#5B5140" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="normal" text-anchor="start">P_init / P_sh / P_echo 的物理地址由运行时分配，不是固定常数；每个进程有自己的页表。</text>
<text x="51" y="865" fill="#5B5140" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="normal" text-anchor="start">sz 来自本参考树的 _init、_sh、_echo ELF 与各自 2 页 guard+栈；若二进制重编译，数值需重验。</text>
