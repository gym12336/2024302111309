<!-- ============ 槽位推导 ============ -->
<text class="t h" x="24" y="576">批注①　槽位与 pid 的对应关系是推导出来的，不是猜的</text>
<rect x="24" y="588" width="590" height="126" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text class="m dt" x="36" y="608">规则一：nextpid = 1 起，每次 allocproc 后自增　　proc.c:15 / 98-99</text>
<text class="m dt" x="36" y="626">规则二：allocproc 从 proc[0] 线性扫第一个 UNUSED 槽　proc.c:120 附近</text>
<line x1="36" y1="636" x2="602" y2="636" stroke="#e5e7eb" stroke-width="1"/>
<text class="m dt" x="36" y="654">userinit()　　　　→ proc[0]，pid 1　→ init</text>
<text class="m dt" x="36" y="672">init 的 fork()　　→ proc[1]，pid 2　→ 后被 exec 成 sh</text>
<text class="m dt" x="36" y="690">sh 的 fork()　　　→ proc[2]，pid 3　→ 后被 exec 成 echo</text>
<text class="t dt" x="36" y="708" fill="#b91c1c">注意：exec 不新建进程，槽位和 pid 都不变，只换页表和 sz。</text>

<!-- ============ 睡眠通道方向 ============ -->
<text class="t h" x="640" y="576">批注②　睡眠通道的方向极易画反（疑问点）</text>
<rect x="640" y="588" width="576" height="126" rx="4" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
<text class="m dt" x="652" y="608">kwait() 里调的是 sleep_prepare(p)，参数 p == myproc() 自己：</text>
<rect x="668" y="616" width="150" height="34" rx="3" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.3"/>
<text class="t h2" x="743" y="632" text-anchor="middle" fill="#5b21b6">sh　proc[1]</text>
<text class="m dt" x="743" y="646" text-anchor="middle" fill="#6d28d9">chan = &amp;proc[1]</text>
<rect x="1000" y="616" width="150" height="34" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
<text class="t h2" x="1075" y="632" text-anchor="middle" fill="#166534">echo　proc[2]</text>
<text class="m dt" x="1075" y="646" text-anchor="middle" fill="#15803d">将来 kexit()</text>
<path d="M996,640 L824,640" stroke="#c2410c" stroke-width="2" fill="none" marker-end="url(#ao)"/>
<text class="m dt" x="910" y="634" text-anchor="middle" fill="#c2410c">wakeup(p-&gt;parent)</text>
<text class="t dt" x="652" y="676" fill="#92400e">✓ 我睡在【我自己】的名字上，等别人喊我的名字。</text>
<text class="t dt" x="652" y="694" fill="#b91c1c">✗ 错画成 chan = &amp;proc[2]（子进程地址）—— 那样没人会来唤醒。</text>

<!-- ============ sh 没有堆 ============ -->
<text class="t h" x="24" y="756">批注③　反直觉：sh 的 sz 停在 0x5000，它一次 malloc 都没调过</text>
<rect x="24" y="768" width="590" height="108" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
<text class="m dt" x="36" y="788">// sh.c:172-174　父子分工的关键三行</text>
<text class="m dt" x="36" y="806">if (fork1() == 0)</text>
<text class="m dt" x="52" y="824">runcmd(parsecmd(cmd));　← parsecmd 的一堆 malloc 在【子进程】里</text>
<text class="m dt" x="36" y="842">wait(0);　　　　　　　　 ← 父进程直接来这儿睡</text>
<text class="t dt" x="36" y="864" fill="#166534">父 sh 只用静态 buf[100] + fork + wait，堆区从头到尾没长过。</text>

<!-- ============ 0x15000 从哪来 ============ -->
<text class="t h" x="640" y="756">批注④　echo 的 oldsz = 0x15000 是怎么来的（边界特例）</text>
<rect x="640" y="768" width="576" height="108" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text class="t dt" x="652" y="788">子进程继承 sh 的 sz = 0x5000，然后 parsecmd 第一次 malloc：</text>
<text class="m dt" x="652" y="806">umalloc.c:52-54　if (nu &lt; 4096) nu = 4096;　sbrk(nu * sizeof(Header))</text>
<text class="m dt" x="652" y="824">sizeof(Header) = 16（readelf -s 实测）→ sbrk(0x10000)</text>
<text class="m dt" x="652" y="842">0x5000 + 0x10000 = 0x15000　= kexec 存下的 oldsz（exec.c:84）</text>
<text class="t dt" x="652" y="864" fill="#1d4ed8">exec.c:138 proc_freepagetable(旧表, 0x15000) 按这个范围释放。</text>
</svg>
