<text x="54" y="161" fill="#405761" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="normal" text-anchor="start">此刻 echo 仍在 sys_exec / usertrap 的 S 态路径上，state=RUNNING；父 sh 和 init 正在 wait 中。</text>
<text x="54" y="183" fill="#405761" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="normal" text-anchor="start">proc 下标和 pid 是本次无额外进程的示例，不能把它们当作所有运行的固定值。</text>
