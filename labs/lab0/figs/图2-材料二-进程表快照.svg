<text x="36" y="36" fill="#FFFFFF" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="bold" text-anchor="start">材料二①｜进程表快照</text>
<text x="36" y="63" fill="#D9ECEB" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="normal" text-anchor="start">截面：子进程 kexec 成功、尚未返回 echo 用户态；典型单核、无重定向、无其他子进程。</text>
<rect x="35" y="106" width="1250" height="90" rx="5" fill="#FFFFFF" stroke="#C9D7D9" stroke-width="1.5"/>
<rect x="35" y="106" width="5" height="90" rx="0" fill="#CF7B43" stroke="#CF7B43" stroke-width="1.5"/>
