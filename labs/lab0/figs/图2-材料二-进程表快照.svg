<text class="t ti" x="24" y="34">图 2（材料二·快照一）　进程表快照 —— exec 完成、echo 首条用户指令尚未执行</text>
<text class="t sub" x="24" y="55">struct proc proc[NPROC]，NPROC = 64　·　此刻只有 3 个槽位非 UNUSED　·　CPU 仍在 S 态，站在 proc[2] 的内核栈上</text>

