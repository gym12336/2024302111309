<!-- ================= C：两个要点 ================= -->
<text class="t h" x="24" y="898">C　两处关键结论</text>

<rect x="24" y="910" width="620" height="98" rx="4" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.3"/>
<text class="t h2" x="36" y="930" fill="#92400e">批注⑧　exec 完全不碰 ofile —— xv6 没有 close-on-exec（启发点）</text>
<text class="t dt" x="36" y="950">kexec() 从头读到尾，没有一处 ofile / filedup / fileclose，也没有 FD_CLOEXEC。</text>
<text class="t dt" x="36" y="968" fill="#92400e">这正是 shell 重定向能工作的原因：子进程先 close(1); open(file);，再 exec，</text>
<text class="t dt" x="36" y="986" fill="#92400e">新镜像自然继承改好的 fd 表。echo 的 write(1,…) 能打到屏幕，靠的就是这份</text>
<text class="t dt" x="36" y="1004" fill="#92400e">从 init 一路继承、穿过两次 fork 和一次 exec 都没被动过的表。</text>

<rect x="660" y="910" width="616" height="98" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
<text class="t h2" x="672" y="930" fill="#1e40af">批注⑨　为什么是 FD_DEVICE，以及 console 不在磁盘里（疑问点）</text>
<text class="m dt" x="672" y="950">sys_open 分岔（sysfile.c:357）：ip-&gt;type == T_DEVICE → f-&gt;type = FD_DEVICE，记 major。</text>
<text class="t dt" x="672" y="968">mkfs/mkfs.c 里搜不到 console / mknod / T_DEVICE（已 grep 确认）——</text>
<text class="t dt" x="672" y="986" fill="#1d4ed8">console 不在磁盘镜像里，每次开机由 init 用 mknod 在运行期造出来，所以 inum 不写死。</text>
<text class="m dt" x="672" y="1004" fill="#b91c1c">filewrite 里 devsw[..].write(1, addr, n) 的第一个实参 1 = "来自用户空间"，不是 fd 1。</text>

<rect x="24" y="1024" width="1252" height="80" rx="4" fill="#fef2f2" stroke="#f87171" stroke-width="1.3"/>
<text class="t h2" x="36" y="1044" fill="#991b1b">批注⑩　账本第 5、6 步是个真实存在但净效果为零的干扰项（边界特例）—— 画快照时不能画进去，但必须知道它发生过</text>
<text class="m dt" x="36" y="1064">// sh.c:151-156　sh 开场的这个循环，目的不是"去开一个新的 console"</text>
<text class="m dt" x="36" y="1080">while ((fd = open("console", O_RDWR)) &gt;= 0) { if (fd &gt;= 3) { close(fd); break; } }</text>
<text class="t dt" x="640" y="1064" fill="#991b1b">sh 从 fork 继承来的 fd 0/1/2 已占着，所以这次 open 必然返回 3 ——</text>
<text class="t dt" x="640" y="1080" fill="#991b1b">filealloc 从 ftable 另取一槽建了第二个 struct file，随即 close(3) 退掉。循环的真正目的是【确认 0/1/2 已经开着】。</text>
</svg>
