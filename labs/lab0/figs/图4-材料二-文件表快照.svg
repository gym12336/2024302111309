<!-- ================= B：ref = 9 账本 ================= -->
<text class="t h" x="24" y="628">B　ref = 9 的逐笔账本 —— 每一笔都有源码位置</text>

<rect x="24" y="640" width="700" height="26" fill="#334155"/>
<text class="t h2" x="34" y="658" fill="#fff">#</text>
<text class="t h2" x="70" y="658" fill="#fff">事件</text>
<text class="t h2" x="440" y="658" fill="#fff">源码位置</text>
<text class="t h2" x="626" y="658" fill="#fff">ref 变化</text>

<g>
 <rect x="24" y="666" width="700" height="24" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1"/>
 <rect x="24" y="690" width="700" height="24" fill="#fff" stroke="#e5e7eb" stroke-width="1"/>
 <rect x="24" y="714" width="700" height="24" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1"/>
 <rect x="24" y="738" width="700" height="24" fill="#fff" stroke="#e5e7eb" stroke-width="1"/>
 <rect x="24" y="762" width="700" height="24" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
 <rect x="24" y="786" width="700" height="24" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
 <rect x="24" y="810" width="700" height="24" fill="#fff" stroke="#e5e7eb" stroke-width="1"/>
 <rect x="24" y="834" width="700" height="26" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.4"/>
</g>
<text class="m ix" x="34" y="682">1</text>
<text class="t ix" x="70" y="682">init：open("console", O_RDWR) → fd 0，filealloc 置 ref=1</text>
<text class="m cn" x="440" y="682">sysfile.c:349 → file.c:37</text>
<text class="m ix" x="626" y="682">0 → 1</text>

<text class="m ix" x="34" y="706">2</text>
<text class="t ix" x="70" y="706">init：dup(0) → fd 1（stdout 诞生）</text>
<text class="m cn" x="440" y="706">init.c:23 → sysfile.c:64</text>
<text class="m ix" x="626" y="706">1 → 2</text>

<text class="m ix" x="34" y="730">3</text>
<text class="t ix" x="70" y="730">init：dup(0) → fd 2（stderr）</text>
<text class="m cn" x="440" y="730">init.c:24 → sysfile.c:64</text>
<text class="m ix" x="626" y="730">2 → 3</text>

<text class="m ix" x="34" y="754">4</text>
<text class="t ix" x="70" y="754">init fork 出 sh：复制 ofile[0..2]，3 次 filedup</text>
<text class="m cn" x="440" y="754">proc.c:286-287</text>
<text class="m ix" x="626" y="754">3 → 6</text>

<text class="m ix" x="34" y="778">5</text>
<text class="t ix" x="70" y="778" fill="#991b1b">sh：open("console") 拿到 fd 3 —— 新建【另一个】struct file</text>
<text class="m cn" x="440" y="778" fill="#991b1b">sh.c:152</text>
<text class="m ix" x="626" y="778" fill="#991b1b">另一槽 0→1</text>

<text class="m ix" x="34" y="802">6</text>
<text class="t ix" x="70" y="802" fill="#991b1b">sh：立刻 close(fd)，那个槽归零释放 —— 净效果为零</text>
<text class="m cn" x="440" y="802" fill="#991b1b">sh.c:154 → file.c:60</text>
<text class="m ix" x="626" y="802" fill="#991b1b">另一槽 1→0</text>

<text class="m ix" x="34" y="826">7</text>
<text class="t ix" x="70" y="826">sh fork 出子进程：复制 ofile[0..2]，3 次 filedup</text>
<text class="m cn" x="440" y="826">proc.c:286-287</text>
<text class="m ix" x="626" y="826">6 → 9</text>

<text class="m ix" x="34" y="851">8</text>
<text class="t ix" x="70" y="851" font-weight="700" fill="#92400e">子进程 exec("echo") —— kexec 全文不含 ofile/filedup/fileclose</text>
<text class="m cn" x="440" y="851" fill="#92400e">exec.c:27-150</text>
<text class="m ix" x="626" y="851" font-weight="700" fill="#92400e">不变，仍 9</text>

