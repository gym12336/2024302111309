<text x="51" y="926" fill="#5B5140" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="normal" text-anchor="start">guard 是真实分配的一页，只通过 uvmclear 清掉 PTE_U；它不是一个未映射的洞。</text>
<text x="51" y="949" fill="#5B5140" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="normal" text-anchor="start">本次 echo 的 sz=0x4000：0x4000 是未来堆增长起点，此刻没有堆的叶子 PTE。</text>
