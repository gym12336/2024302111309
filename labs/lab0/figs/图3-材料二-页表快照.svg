<text x="54" y="161" fill="#405761" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="normal" text-anchor="start">satp → L2[0] → L1[0] → L0[0..3]；另一路 L2[255] → L1[511] → L0[510..511]。</text>
