<text class="t h2" x="492" y="1032" fill="#1e40af">批注⑦　堆在栈的【上面】，而且栈永不增长 —— 照抄经典教材图必错（启发点）</text>
<text class="t dt" x="492" y="1054">经典图：栈在高地址往下长，堆在低地址往上长，两者相向对撞。</text>
<text class="t dt" x="492" y="1074" fill="#1d4ed8">xv6 实际：USERSTACK=1（param.h:14）把用户栈写死成 1 页，上界 0x4000 永远不动；</text>
<text class="m dt" x="504" y="1092" fill="#1d4ed8">sbrk → growproc（proc.c:236）只会从 0x4000 往【高处】铺堆页。</text>
<text class="t dt" x="492" y="1112">所以顺序是：代码 → 数据 → guard → 固定 1 页栈 → 堆 → …… → trapframe → trampoline。</text>
<text class="t dt" x="492" y="1132" fill="#b91c1c">附带后果：echo 的 main 恰好落在 VA 0x0（entry 0x7c 是 ulib.c 的 start）——</text>
<text class="t dt" x="504" y="1150" fill="#b91c1c">空指针地址上有真代码，xv6 里解引用 NULL 不一定崩。</text>
</svg>
