<text x="704" y="275" fill="#405761" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="normal" text-anchor="start">L0[510] trapframe；[511] trampoline。</text>
<text x="704" y="297" fill="#405761" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="normal" text-anchor="start">都不带 U；trampoline 在内核页表中也有映射。</text>
