<text class="t ix" x="856" y="300" fill="#6b7280">完全未映射的巨大空洞</text>
<text class="t cn" x="1024" y="300">—</text>
<text class="t cn" x="1150" y="300">—</text>
<text class="t dt" x="690" y="319">sz = 0x4000 到此为止。堆区【此刻不存在】—— echo 从不调 sbrk。将来 sbrk 会从 0x4000 往上铺堆页。</text>

<rect x="680" y="420" width="596" height="26" fill="#ede9fe" stroke="#cbd5e1" stroke-width="1"/>
<text class="m ix" x="690" y="437">0x3f_ffff_e000 – …efff</text>
<text class="t ix" x="856" y="437">trapframe</text>
<text class="m pm" x="1024" y="437" fill="#6b21a8">V R W ―</text>
<text class="m ix" x="1150" y="437">0x07</text>
<text class="m cn" x="1222" y="437">p-&gt;trapframe</text>

<rect x="680" y="448" width="596" height="26" fill="#d1fae5" stroke="#cbd5e1" stroke-width="1"/>
