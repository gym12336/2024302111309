<text class="t ix" x="856" y="465">trampoline</text>
<text class="m pm" x="1024" y="465" fill="#166534">V R X ―</text>
<text class="m ix" x="1150" y="465">0x0b</text>
<text class="t cn" x="1222" y="465">与内核共享</text>

<!-- 页表页开销 -->
<rect x="680" y="486" width="596" height="30" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
<text class="t dt" x="690" y="505">开销账：数据页 5 个（4 个用户页 + 1 个 trapframe）＋ 页表页 5 个（1×L2 + 2×L1 + 2×L0）。trampoline 是全系统共享，不计入。</text>

<!-- ================= B：权限位来源 ================= -->
<text class="t h" x="24" y="558">B　权限位不是照抄 ELF —— R 和 U 是内核硬加的</text>

<rect x="24" y="570" width="620" height="188" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text class="m dt" x="36" y="590">// exec.c:13-22　只翻译 X 和 W，ELF 的 R 位根本不看</text>
<text class="m dt" x="36" y="606">int flags2perm(int flags) {</text>
<text class="m dt" x="52" y="622">int perm = 0;</text>
<text class="m dt" x="52" y="638">if (flags &amp; 0x1) perm  = PTE_X;　　// ELF PF_X</text>
<text class="m dt" x="52" y="654">if (flags &amp; 0x2) perm |= PTE_W;　　// ELF PF_W</text>
<text class="m dt" x="52" y="670">return perm;　　　　　　　　　　　　// PF_R(0x4) 被忽略</text>
<text class="m dt" x="36" y="686">}</text>
<line x1="36" y1="696" x2="632" y2="696" stroke="#e5e7eb" stroke-width="1"/>
<text class="m dt" x="36" y="714">// vm.c:234　PTE_R 和 PTE_U 在这里无条件加上</text>
<text class="m dt" x="36" y="730">mappages(pagetable, a, PGSIZE, (uint64)mem, PTE_R | PTE_U | xperm);</text>
<text class="t dt" x="36" y="750" fill="#b91c1c">所以代码段的 R 不是因为 ELF 写了 R，而是 uvmalloc 硬塞的。</text>

<!-- 推导表 -->
<rect x="660" y="570" width="616" height="188" rx="4" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
<rect x="660" y="570" width="616" height="26" fill="#475569"/>
<text class="t h2" x="670" y="588" fill="#fff">段</text>
<text class="t h2" x="754" y="588" fill="#fff">ELF flags</text>
<text class="t h2" x="866" y="588" fill="#fff">flags2perm 产出</text>
<text class="t h2" x="1010" y="588" fill="#fff">＋ R|U</text>
<text class="t h2" x="1130" y="588" fill="#fff">最终 PTE</text>
<g stroke="#e5e7eb" stroke-width="1"><line x1="660" y1="622" x2="1276" y2="622"/><line x1="660" y1="648" x2="1276" y2="648"/><line x1="660" y1="674" x2="1276" y2="674"/></g>
<text class="t ix" x="670" y="614">LOAD1 代码</text>
<text class="m ix" x="754" y="614">0x5　R+X</text>
<text class="m ix" x="866" y="614">PTE_X</text>
<text class="m ix" x="1010" y="614">R|U|X</text>
<text class="m ix" x="1130" y="614" font-weight="700">0x1b　无 W</text>
<text class="t ix" x="670" y="640">LOAD2 数据</text>
<text class="m ix" x="754" y="640">0x6　R+W</text>
<text class="m ix" x="866" y="640">PTE_W</text>
<text class="m ix" x="1010" y="640">R|U|W</text>
<text class="m ix" x="1130" y="640" font-weight="700">0x17　无 X</text>
<text class="t ix" x="670" y="666">用户栈</text>
<text class="t ix" x="754" y="666">—（非 ELF 段）</text>
<text class="m ix" x="866" y="666">exec.c:91 传 PTE_W</text>
<text class="m ix" x="1010" y="666">R|U|W</text>
<text class="m ix" x="1130" y="666" font-weight="700">0x17</text>
<text class="t ix" x="670" y="692">guard</text>
<text class="t ix" x="754" y="692">—</text>
<text class="m ix" x="866" y="692">同上，然后 uvmclear</text>
<text class="m ix" x="1010" y="692">清掉 U</text>
<text class="m ix" x="1130" y="692" font-weight="700" fill="#991b1b">0x07</text>
<text class="m dt" x="670" y="718">PTE 位定义　riscv.h:395-399　V=1&lt;&lt;0　R=1&lt;&lt;1　W=1&lt;&lt;2　X=1&lt;&lt;3　U=1&lt;&lt;4</text>
<text class="t dt" x="670" y="738" fill="#b91c1c">trapframe 和 guard 的权限位字面上完全相同（都是 0x07），语义相反 ——</text>
<text class="t dt" x="670" y="752" fill="#b91c1c">前者是"内核要用、用户不许碰"，后者是"谁都不该碰"。只能靠 VA 位置区分。</text>

<!-- ================= C：guard page 真相 ================= -->
<text class="t h" x="24" y="798">C　批注⑤　用户栈 guard 是"看得见摸不着"，不是空洞（边界特例）</text>

<rect x="24" y="810" width="620" height="150" rx="4" fill="#fef2f2" stroke="#f87171" stroke-width="1.3"/>
<text class="m dt" x="36" y="830">// vm.c:331-338　整个函数只做一件事</text>
<text class="m dt" x="36" y="846">void uvmclear(pagetable_t pagetable, uint64 va) {</text>
<text class="m dt" x="52" y="862">pte_t *pte = walk(pagetable, va, 0);</text>
<text class="m dt" x="52" y="878">if (pte == 0) panic("uvmclear");</text>
<text class="m dt" x="52" y="894" font-weight="700" fill="#991b1b">*pte &amp;= ~PTE_U;　　← 只清 U，V / R / W 全都留着</text>
<text class="m dt" x="36" y="910">}</text>
<text class="t dt" x="36" y="932" fill="#991b1b">exec.c:91 的 uvmalloc 真的 kalloc 了一页物理内存给它，白占 4KB。</text>
<text class="t dt" x="36" y="950" fill="#991b1b">栈溢出访问 0x2000 → PTE 有效但 U=0 → 权限异常（scause=15），不是缺页。</text>

<rect x="660" y="810" width="616" height="150" rx="4" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.3"/>
<text class="t h2" x="672" y="830" fill="#92400e">批注⑥　为什么懒分配的 vmfault 救不了栈溢出（疑问点）</text>
<text class="m dt" x="672" y="850">// vm.c:459-478</text>
<text class="m dt" x="672" y="866">if (va &gt;= psz) return 0;　　　　　// 0x2000 &lt; sz=0x4000，这关过了</text>
<text class="m dt" x="672" y="882">va = PGROUNDDOWN(va);</text>
<text class="m dt" x="672" y="898" font-weight="700" fill="#92400e">if (ismapped(pagetable, va)) return 0;　← 在这里被拒绝！</text>
<text class="t dt" x="672" y="920" fill="#92400e">guard 页的 PTE 是【有效】的，ismapped 返回真，vmfault 直接放弃。</text>
<text class="t dt" x="672" y="940" fill="#b91c1c">结论反直觉：guard page 能拦住溢出，恰恰是因为它"已映射"。</text>
<text class="t dt" x="672" y="956" fill="#92400e">若它是空洞，vmfault 反而会热心地补一页，溢出就悄悄成功了。</text>

<!-- ================= D：索引 + 布局反常识 ================= -->
<text class="t h" x="24" y="1000">D　三级索引复算　·　以及 xv6 用户空间布局的反常识之处</text>

