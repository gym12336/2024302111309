<text class="t h2" x="300" y="1029" fill="#fff">L1</text>
<text class="t h2" x="370" y="1029" fill="#fff">L0</text>
<g stroke="#e5e7eb" stroke-width="1">
 <line x1="24" y1="1058" x2="464" y2="1058"/><line x1="24" y1="1080" x2="464" y2="1080"/>
 <line x1="24" y1="1102" x2="464" y2="1102"/><line x1="24" y1="1124" x2="464" y2="1124"/>
</g>
<text class="m ix" x="36" y="1052">0x0000</text><text class="m ix" x="230" y="1052">0</text><text class="m ix" x="300" y="1052">0</text><text class="m ix" x="370" y="1052">0</text>
<text class="m ix" x="36" y="1074">0x1000</text><text class="m ix" x="230" y="1074">0</text><text class="m ix" x="300" y="1074">0</text><text class="m ix" x="370" y="1074">1</text>
