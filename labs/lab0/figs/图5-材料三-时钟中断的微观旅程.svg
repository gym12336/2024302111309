<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 1173" width="1320" height="1173">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#66788A"/></marker></defs>
<rect width="1320" height="1173" fill="#F7F9FA"/>
<rect width="1320" height="78" fill="#153B45"/>
<text x="36" y="36" fill="#FFFFFF" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="bold" text-anchor="start">材料三｜一次 S 态时钟中断的微观旅程</text>
<text x="36" y="63" fill="#D9ECEB" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="normal" text-anchor="start">例：单核 echo 正在 U 态运行；scause=0x8000000000000005；本树使用 stimecmp 直接触发 S 态时钟中断。</text>
<rect x="35" y="103" width="180" height="87" rx="5" fill="#FFFFFF" stroke="#C9D7D9" stroke-width="1.5"/>
<rect x="35" y="103" width="5" height="87" rx="0" fill="#CF7B43" stroke="#CF7B43" stroke-width="1.5"/>
<text x="54" y="132" fill="#18313B" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="bold" text-anchor="start">01 触发</text>
<rect x="232" y="103" width="740" height="87" rx="5" fill="#FFFFFF" stroke="#C9D7D9" stroke-width="1.5"/>
<rect x="232" y="103" width="5" height="87" rx="0" fill="#CF7B43" stroke="#CF7B43" stroke-width="1.5"/>
<text x="251" y="132" fill="#18313B" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="bold" text-anchor="start">time ≥ stimecmp，CPU 接受时钟中断</text>
<text x="251" y="158" fill="#405761" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="normal" text-anchor="start">硬件记 sepc，写 scause=高位1+原因5，SPP=0，关 SIE。</text>
<rect x="989" y="103" width="296" height="87" rx="5" fill="#F2F6F6" stroke="#C9D7D9" stroke-width="1.5"/>
<rect x="989" y="103" width="5" height="87" rx="0" fill="#CF7B43" stroke="#CF7B43" stroke-width="1.5"/>
<text x="1008" y="132" fill="#18313B" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="bold" text-anchor="start">运行状态</text>
<text x="1008" y="158" fill="#405761" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="normal" text-anchor="start">U→S｜暂用 echo 用户栈</text>
<text x="1008" y="180" fill="#405761" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="normal" text-anchor="start">无锁；当前还是用户页表</text>
<line x1="224" y1="191" x2="224" y2="203" stroke="#66788A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="35" y="204" width="180" height="87" rx="5" fill="#FFFFFF" stroke="#C9D7D9" stroke-width="1.5"/>
<rect x="35" y="204" width="5" height="87" rx="0" fill="#087E83" stroke="#087E83" stroke-width="1.5"/>
<text x="54" y="233" fill="#18313B" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="bold" text-anchor="start">02 保存</text>
<rect x="232" y="204" width="740" height="87" rx="5" fill="#FFFFFF" stroke="#C9D7D9" stroke-width="1.5"/>
<rect x="232" y="204" width="5" height="87" rx="0" fill="#087E83" stroke="#087E83" stroke-width="1.5"/>
<text x="251" y="233" fill="#18313B" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="bold" text-anchor="start">stvec → trampoline:uservec</text>
<text x="251" y="259" fill="#405761" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="normal" text-anchor="start">用户通用寄存器保存到 TRAPFRAME；还没有进入 C 代码。</text>
<rect x="989" y="204" width="296" height="87" rx="5" fill="#F2F6F6" stroke="#C9D7D9" stroke-width="1.5"/>
<rect x="989" y="204" width="5" height="87" rx="0" fill="#087E83" stroke="#087E83" stroke-width="1.5"/>
<text x="1008" y="233" fill="#18313B" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="bold" text-anchor="start">运行状态</text>
<text x="1008" y="259" fill="#405761" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="normal" text-anchor="start">S｜仍用原 sp</text>
<text x="1008" y="281" fill="#405761" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="normal" text-anchor="start">无锁；仍是用户页表</text>
<line x1="224" y1="292" x2="224" y2="304" stroke="#66788A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="35" y="305" width="180" height="87" rx="5" fill="#FFFFFF" stroke="#C9D7D9" stroke-width="1.5"/>
<rect x="35" y="305" width="5" height="87" rx="0" fill="#087E83" stroke="#087E83" stroke-width="1.5"/>
<text x="54" y="334" fill="#18313B" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="bold" text-anchor="start">03 换栈表</text>
<rect x="232" y="305" width="740" height="87" rx="5" fill="#FFFFFF" stroke="#C9D7D9" stroke-width="1.5"/>
<rect x="232" y="305" width="5" height="87" rx="0" fill="#087E83" stroke="#087E83" stroke-width="1.5"/>
<text x="251" y="334" fill="#18313B" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="bold" text-anchor="start">uservec 装 kernel_sp，切 kernel_satp</text>
<text x="251" y="360" fill="#405761" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="normal" text-anchor="start">sp 改为 echo 内核栈顶；sfence.vma 后进入 usertrap。</text>
<rect x="989" y="305" width="296" height="87" rx="5" fill="#F2F6F6" stroke="#C9D7D9" stroke-width="1.5"/>
<rect x="989" y="305" width="5" height="87" rx="0" fill="#087E83" stroke="#087E83" stroke-width="1.5"/>
<text x="1008" y="334" fill="#18313B" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="bold" text-anchor="start">运行状态</text>
<text x="1008" y="360" fill="#405761" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="normal" text-anchor="start">S｜echo 内核栈</text>
<text x="1008" y="382" fill="#405761" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="normal" text-anchor="start">无锁；换为内核页表</text>
<line x1="224" y1="393" x2="224" y2="405" stroke="#66788A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="35" y="406" width="180" height="87" rx="5" fill="#FFFFFF" stroke="#C9D7D9" stroke-width="1.5"/>
<rect x="35" y="406" width="5" height="87" rx="0" fill="#087E83" stroke="#087E83" stroke-width="1.5"/>
<text x="54" y="435" fill="#18313B" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="bold" text-anchor="start">04 分发</text>
<rect x="232" y="406" width="740" height="87" rx="5" fill="#FFFFFF" stroke="#C9D7D9" stroke-width="1.5"/>
<rect x="232" y="406" width="5" height="87" rx="0" fill="#087E83" stroke="#087E83" stroke-width="1.5"/>
<text x="251" y="435" fill="#18313B" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="bold" text-anchor="start">usertrap 保存 epc；devintr 识别原因 5</text>
<text x="251" y="461" fill="#405761" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="normal" text-anchor="start">改 stvec=kernelvec；时钟中断不做 epc+=4。</text>
<rect x="989" y="406" width="296" height="87" rx="5" fill="#F2F6F6" stroke="#C9D7D9" stroke-width="1.5"/>
<rect x="989" y="406" width="5" height="87" rx="0" fill="#087E83" stroke="#087E83" stroke-width="1.5"/>
<text x="1008" y="435" fill="#18313B" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="bold" text-anchor="start">运行状态</text>
<text x="1008" y="461" fill="#405761" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="normal" text-anchor="start">S｜echo 内核栈</text>
<text x="1008" y="483" fill="#405761" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="normal" text-anchor="start">无锁</text>
<line x1="224" y1="494" x2="224" y2="506" stroke="#66788A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="35" y="507" width="180" height="87" rx="5" fill="#FFFFFF" stroke="#C9D7D9" stroke-width="1.5"/>
<rect x="35" y="507" width="5" height="87" rx="0" fill="#087E83" stroke="#087E83" stroke-width="1.5"/>
<text x="54" y="536" fill="#18313B" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="bold" text-anchor="start">05 时钟</text>
<rect x="232" y="507" width="740" height="87" rx="5" fill="#FFFFFF" stroke="#C9D7D9" stroke-width="1.5"/>
<rect x="232" y="507" width="5" height="87" rx="0" fill="#087E83" stroke="#087E83" stroke-width="1.5"/>
<text x="251" y="536" fill="#18313B" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="bold" text-anchor="start">clockintr：ticks++，wakeup，续约</text>
<text x="251" y="562" fill="#405761" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="normal" text-anchor="start">hart0 短暂持 tickslock；w_stimecmp(time+1000000)。</text>
<rect x="989" y="507" width="296" height="87" rx="5" fill="#F2F6F6" stroke="#C9D7D9" stroke-width="1.5"/>
<rect x="989" y="507" width="5" height="87" rx="0" fill="#087E83" stroke="#087E83" stroke-width="1.5"/>
<text x="1008" y="536" fill="#18313B" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="bold" text-anchor="start">运行状态</text>
<text x="1008" y="562" fill="#405761" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="normal" text-anchor="start">S｜echo 内核栈</text>
<text x="1008" y="584" fill="#405761" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="normal" text-anchor="start">tickslock 随即释放</text>
<line x1="224" y1="595" x2="224" y2="607" stroke="#66788A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="35" y="608" width="180" height="87" rx="5" fill="#FFFFFF" stroke="#C9D7D9" stroke-width="1.5"/>
<rect x="35" y="608" width="5" height="87" rx="0" fill="#CF7B43" stroke="#CF7B43" stroke-width="1.5"/>
<text x="54" y="637" fill="#18313B" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="bold" text-anchor="start">06 让步</text>
<rect x="232" y="608" width="740" height="87" rx="5" fill="#FFFFFF" stroke="#C9D7D9" stroke-width="1.5"/>
<rect x="232" y="608" width="5" height="87" rx="0" fill="#CF7B43" stroke="#CF7B43" stroke-width="1.5"/>
<text x="251" y="637" fill="#18313B" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="bold" text-anchor="start">which_dev=2 → yield → sched</text>
<text x="251" y="663" fill="#405761" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="normal" text-anchor="start">echo: RUNNING→RUNNABLE；存 context，swtch 到调度器。</text>
<rect x="989" y="608" width="296" height="87" rx="5" fill="#F2F6F6" stroke="#C9D7D9" stroke-width="1.5"/>
<rect x="989" y="608" width="5" height="87" rx="0" fill="#CF7B43" stroke="#CF7B43" stroke-width="1.5"/>
<text x="1008" y="637" fill="#18313B" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="bold" text-anchor="start">运行状态</text>
<text x="1008" y="663" fill="#405761" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="normal" text-anchor="start">S｜echo 内核栈→调度器栈</text>
<text x="1008" y="685" fill="#405761" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="normal" text-anchor="start">只持 echo.lock 跨 swtch</text>
<line x1="224" y1="696" x2="224" y2="708" stroke="#66788A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="35" y="709" width="180" height="87" rx="5" fill="#FFFFFF" stroke="#C9D7D9" stroke-width="1.5"/>
<rect x="35" y="709" width="5" height="87" rx="0" fill="#087E83" stroke="#087E83" stroke-width="1.5"/>
<text x="54" y="738" fill="#18313B" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="bold" text-anchor="start">07 决策</text>
<rect x="232" y="709" width="740" height="87" rx="5" fill="#FFFFFF" stroke="#C9D7D9" stroke-width="1.5"/>
<rect x="232" y="709" width="5" height="87" rx="0" fill="#087E83" stroke="#087E83" stroke-width="1.5"/>
<text x="251" y="738" fill="#18313B" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="bold" text-anchor="start">scheduler 扫 RUNNABLE 进程</text>
<text x="251" y="764" fill="#405761" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="normal" text-anchor="start">选中某进程并 swtch；若仍选 echo，就回到 echo 的 sched。</text>
<rect x="989" y="709" width="296" height="87" rx="5" fill="#F2F6F6" stroke="#C9D7D9" stroke-width="1.5"/>
<rect x="989" y="709" width="5" height="87" rx="0" fill="#087E83" stroke="#087E83" stroke-width="1.5"/>
<text x="1008" y="738" fill="#18313B" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="bold" text-anchor="start">运行状态</text>
<text x="1008" y="764" fill="#405761" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="normal" text-anchor="start">S｜调度器栈→被选进程栈</text>
<text x="1008" y="786" fill="#405761" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="normal" text-anchor="start">选中时持对应 proc.lock</text>
<line x1="224" y1="797" x2="224" y2="809" stroke="#66788A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="35" y="810" width="180" height="87" rx="5" fill="#FFFFFF" stroke="#C9D7D9" stroke-width="1.5"/>
<rect x="35" y="810" width="5" height="87" rx="0" fill="#087E83" stroke="#087E83" stroke-width="1.5"/>
<text x="54" y="839" fill="#18313B" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="bold" text-anchor="start">08 恢复</text>
<rect x="232" y="810" width="740" height="87" rx="5" fill="#FFFFFF" stroke="#C9D7D9" stroke-width="1.5"/>
<rect x="232" y="810" width="5" height="87" rx="0" fill="#087E83" stroke="#087E83" stroke-width="1.5"/>
<text x="251" y="839" fill="#18313B" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="bold" text-anchor="start">echo 重新获选：yield 返回 usertrap</text>
<text x="251" y="865" fill="#405761" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="normal" text-anchor="start">释放 echo.lock；prepare_return 配好 stvec、SPP、SPIE、sepc。</text>
<rect x="989" y="810" width="296" height="87" rx="5" fill="#F2F6F6" stroke="#C9D7D9" stroke-width="1.5"/>
<rect x="989" y="810" width="5" height="87" rx="0" fill="#087E83" stroke="#087E83" stroke-width="1.5"/>
<text x="1008" y="839" fill="#18313B" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="bold" text-anchor="start">运行状态</text>
<text x="1008" y="865" fill="#405761" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="normal" text-anchor="start">S｜echo 内核栈</text>
<text x="1008" y="887" fill="#405761" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="normal" text-anchor="start">无锁；内核页表</text>
<line x1="224" y1="898" x2="224" y2="910" stroke="#66788A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="35" y="911" width="180" height="87" rx="5" fill="#FFFFFF" stroke="#C9D7D9" stroke-width="1.5"/>
<rect x="35" y="911" width="5" height="87" rx="0" fill="#CF7B43" stroke="#CF7B43" stroke-width="1.5"/>
<text x="54" y="940" fill="#18313B" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="bold" text-anchor="start">09 返回</text>
<rect x="232" y="911" width="740" height="87" rx="5" fill="#FFFFFF" stroke="#C9D7D9" stroke-width="1.5"/>
<rect x="232" y="911" width="5" height="87" rx="0" fill="#CF7B43" stroke="#CF7B43" stroke-width="1.5"/>
<text x="251" y="940" fill="#18313B" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="bold" text-anchor="start">trampoline:userret → sret</text>
<text x="251" y="966" fill="#405761" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="normal" text-anchor="start">换回 echo 用户页表，恢复寄存器与用户 sp，sret 回原 PC。</text>
<rect x="989" y="911" width="296" height="87" rx="5" fill="#F2F6F6" stroke="#C9D7D9" stroke-width="1.5"/>
<rect x="989" y="911" width="5" height="87" rx="0" fill="#CF7B43" stroke="#CF7B43" stroke-width="1.5"/>
<text x="1008" y="940" fill="#18313B" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="bold" text-anchor="start">运行状态</text>
<text x="1008" y="966" fill="#405761" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="normal" text-anchor="start">S→U｜echo 用户栈</text>
<text x="1008" y="988" fill="#405761" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="normal" text-anchor="start">无锁；用户页表</text>
<rect x="35" y="1022" width="1250" height="117" rx="5" fill="#FFF8E9" stroke="#DFC57A" stroke-width="1.5"/>
<text x="51" y="1051" fill="#745413" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="bold" text-anchor="start">验收批注：为什么这样画</text>
<text x="51" y="1075" fill="#5B5140" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="normal" text-anchor="start">① 中断不跳过被打断的指令；只有 ecall 返回时才把 epc 加 4。</text>
<text x="51" y="1098" fill="#5B5140" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="normal" text-anchor="start">② 时钟中断触发 yield 抢占：状态变 RUNNABLE，不是 SLEEPING；无需 wakeup 即可再运行。</text>
<text x="51" y="1121" fill="#5B5140" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="normal" text-anchor="start">③ 若另一进程先被选中，echo 的现场仍留在 trapframe+内核栈，等再次调度时继续恢复。</text>
</svg>
